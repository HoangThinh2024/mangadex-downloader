<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MangaDex Downloader</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #ff6740;
            --sidebar-bg: #f8f9fa;
            --text-dark: #1a1a1a;
            --text-light: #6c757d;
            --border-color: #e0e0e0;
            --hover-bg: #f0f0f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #ffffff;
            color: var(--text-dark);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            padding: 20px 0;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            z-index: 1000;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 20px 30px;
            font-size: 1.5em;
            font-weight: bold;
            color: var(--text-dark);
        }

        .logo i {
            color: var(--primary-color);
            font-size: 1.2em;
        }

        .nav-section {
            margin-bottom: 30px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            color: var(--text-dark);
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95em;
        }

        .nav-item:hover {
            background: var(--hover-bg);
        }

        .nav-item.active {
            background: white;
            border-left: 3px solid var(--primary-color);
            font-weight: 600;
        }

        .nav-item i {
            width: 20px;
            text-align: center;
            color: var(--text-light);
        }

        .nav-item.active i {
            color: var(--primary-color);
        }

        /* Main Content */
        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 30px 40px;
            max-width: calc(100% - 260px);
        }

        /* Search Bar */
        .search-bar {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .search-input-wrapper {
            position: relative;
            flex: 1;
            max-width: 600px;
        }

        .search-input {
            width: 100%;
            padding: 12px 45px 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95em;
            transition: all 0.2s;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(255, 103, 64, 0.1);
        }

        .search-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            padding: 5px 10px;
        }

        /* Filters */
        .filters-section {
            background: var(--sidebar-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .filters-title {
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .filter-group label {
            font-size: 0.85em;
            color: var(--text-light);
            font-weight: 500;
        }

        .filter-group select,
        .filter-group input {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9em;
            background: white;
        }

        .tags-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .tag-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tag-badge.include {
            background: #d4edda;
            color: #155724;
        }

        .tag-badge.exclude {
            background: #f8d7da;
            color: #721c24;
        }

        .tag-badge button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1em;
            padding: 0;
            color: inherit;
        }

        .btn-tags {
            padding: 8px 16px;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9em;
            transition: all 0.2s;
        }

        .btn-tags:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        /* Manga Grid */
        .manga-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .manga-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid var(--border-color);
        }

        .manga-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .manga-cover {
            width: 100%;
            height: 260px;
            object-fit: cover;
            background: #f0f0f0;
        }

        .manga-info {
            padding: 12px;
        }

        .manga-title {
            font-size: 0.9em;
            font-weight: 600;
            margin-bottom: 5px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            line-height: 1.4;
        }

        .manga-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.8em;
            color: var(--text-light);
            margin-top: 5px;
        }

        .rating {
            display: flex;
            align-items: center;
            gap: 3px;
            color: #ffc107;
        }

        /* Manga Detail */
        .manga-detail {
            display: none;
            animation: fadeIn 0.3s;
        }

        .manga-detail.active {
            display: block;
        }

        .detail-header {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .detail-cover-img {
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .detail-info {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .detail-title {
            font-size: 2em;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 10px;
        }

        .detail-subtitle {
            font-size: 1.1em;
            color: var(--text-light);
            line-height: 1.5;
        }

        .detail-author {
            font-size: 0.95em;
            color: var(--text-light);
        }

        .detail-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-primary {
            padding: 12px 24px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-primary:hover {
            background: #e55a36;
            transform: translateY(-2px);
        }

        .btn-secondary {
            padding: 12px 24px;
            background: white;
            color: var(--text-dark);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            background: var(--hover-bg);
        }

        .detail-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .tag-chip {
            padding: 5px 12px;
            background: #f0f0f0;
            border-radius: 15px;
            font-size: 0.85em;
            text-transform: uppercase;
            font-weight: 500;
        }

        .detail-description {
            line-height: 1.7;
            color: var(--text-dark);
            margin-top: 20px;
        }

        /* Chapters List */
        .chapters-section {
            margin-top: 30px;
        }

        .chapters-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: var(--sidebar-bg);
            border-radius: 8px 8px 0 0;
            font-weight: 600;
        }

        .chapter-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border: 1px solid var(--border-color);
            border-top: none;
            transition: all 0.2s;
            cursor: pointer;
        }

        .chapter-item:hover {
            background: var(--sidebar-bg);
        }

        .chapter-item:last-child {
            border-radius: 0 0 8px 8px;
        }

        .chapter-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .chapter-number {
            font-weight: 600;
        }

        .chapter-meta {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 0.9em;
            color: var(--text-light);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            max-width: 700px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            font-size: 1.3em;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            color: var(--text-light);
            padding: 0;
            width: 30px;
            height: 30px;
        }

        .modal-body {
            padding: 20px;
        }

        .modal-tabs {
            display: flex;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .tab-btn.active {
            border-bottom-color: var(--primary-color);
            color: var(--primary-color);
        }

        .tags-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .tag-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px;
            background: var(--sidebar-bg);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tag-checkbox:hover {
            background: var(--hover-bg);
        }

        .tag-checkbox input {
            cursor: pointer;
        }

        .tag-group {
            margin-bottom: 20px;
        }

        .tag-group-title {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85em;
            color: var(--text-light);
            margin-bottom: 10px;
        }

        /* Download Form */
        .download-form {
            background: var(--sidebar-bg);
            border-radius: 12px;
            padding: 30px;
            max-width: 800px;
        }

        .form-field {
            margin-bottom: 20px;
        }

        .form-field label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .form-field input,
        .form-field select {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95em;
            background: white;
        }

        .form-field small {
            display: block;
            margin-top: 5px;
            color: var(--text-light);
            font-size: 0.85em;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* Loading */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: var(--text-light);
        }

        .spinner {
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Hidden */
        .hidden {
            display: none !important;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 70px;
            }

            .main-content {
                margin-left: 70px;
                max-width: calc(100% - 70px);
                padding: 20px;
            }

            .logo span {
                display: none;
            }

            .nav-item span {
                display: none;
            }

            .detail-header {
                grid-template-columns: 1fr;
            }

            .manga-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 15px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo">
            <i class="fas fa-book-open"></i>
            <span>MangaDex</span>
        </div>

        <div class="nav-section">
            <div class="nav-item active" data-view="home">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </div>
            <div class="nav-item" data-view="search">
                <i class="fas fa-search"></i>
                <span>Advanced Search</span>
            </div>
            <div class="nav-item" data-view="latest">
                <i class="fas fa-clock"></i>
                <span>Latest Updates</span>
            </div>
            <div class="nav-item" data-view="download">
                <i class="fas fa-download"></i>
                <span>Download</span>
            </div>
        </div>

        <div class="nav-section">
            <div class="nav-item">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
            </div>
            <div class="nav-item">
                <i class="fas fa-info-circle"></i>
                <span>About</span>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Home View -->
        <div id="home-view" class="view-section active">
            <div class="search-bar">
                <div class="search-input-wrapper">
                    <input type="text" class="search-input" id="quick-search" placeholder="Search manga titles..." />
                    <button class="search-btn"><i class="fas fa-search"></i></button>
                </div>
            </div>

            <!-- Filters -->
            <div class="filters-section">
                <div class="filters-title">
                    <i class="fas fa-filter"></i>
                    Filters & Sort
                </div>

                <div class="filter-row">
                    <div class="filter-group">
                        <label>Status</label>
                        <select id="filter-status">
                            <option value="">Any Status</option>
                            <option value="ongoing">Ongoing</option>
                            <option value="completed">Completed</option>
                            <option value="hiatus">Hiatus</option>
                            <option value="cancelled">Cancelled</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label>Language</label>
                        <select id="filter-language">
                            <option value="">Any Language</option>
                            <option value="ja">Japanese</option>
                            <option value="en">English</option>
                            <option value="ko">Korean</option>
                            <option value="zh">Chinese</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label>Sort By</label>
                        <select id="filter-order">
                            <option value="latestUploadedChapter">Latest Upload</option>
                            <option value="updatedAt">Recently Updated</option>
                            <option value="createdAt">Recently Added</option>
                            <option value="relevance">Relevance</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label>Results</label>
                        <select id="filter-limit">
                            <option value="12">12 per page</option>
                            <option value="24">24 per page</option>
                            <option value="36">36 per page</option>
                            <option value="48">48 per page</option>
                        </select>
                    </div>
                </div>

                <div class="filter-row">
                    <div class="filter-group">
                        <label>Author</label>
                        <input type="text" id="filter-author" placeholder="Search by author..." />
                    </div>

                    <div class="filter-group">
                        <label>Artist</label>
                        <input type="text" id="filter-artist" placeholder="Search by artist..." />
                    </div>
                </div>

                <div class="filter-group">
                    <label>Tags Filtering</label>
                    <button class="btn-tags" id="open-tags-modal">
                        <i class="fas fa-tags"></i>
                        Select Include/Exclude Tags
                    </button>
                    <div class="tags-selector" id="selected-tags-display"></div>
                </div>

                <div style="margin-top: 15px; display: flex; gap: 10px;">
                    <button class="btn-primary" id="apply-filters">
                        <i class="fas fa-search"></i>
                        Search
                    </button>
                    <button class="btn-secondary" id="browse-latest">
                        <i class="fas fa-fire"></i>
                        Browse Latest
                    </button>
                </div>
            </div>

            <!-- Results -->
            <div id="results-container">
                <div class="manga-grid" id="manga-grid">
                    <!-- Manga cards will be inserted here -->
                </div>
            </div>

            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
            </div>
        </div>

        <!-- Manga Detail View -->
        <div id="detail-view" class="manga-detail">
            <button class="btn-secondary" id="back-to-list" style="margin-bottom: 20px;">
                <i class="fas fa-arrow-left"></i>
                Back to List
            </button>

            <div id="manga-detail-content">
                <!-- Detail content will be inserted here -->
            </div>
        </div>

        <!-- Download View -->
        <div id="download-view" class="view-section hidden">
            <h2 style="margin-bottom: 30px;">Download Manga</h2>
            
            <div class="download-form">
                <div class="form-field">
                    <label>Manga URL or ID *</label>
                    <input type="text" id="download-url" placeholder="https://mangadex.org/title/... or manga ID" />
                    <small>Enter MangaDex URL or manga ID</small>
                </div>

                <div class="form-row">
                    <div class="form-field">
                        <label>Format</label>
                        <select id="download-format">
                            <option value="">Auto Detect</option>
                            <option value="pdf">PDF</option>
                            <option value="epub">EPUB</option>
                            <option value="cbz">CBZ</option>
                            <option value="raw">Raw Images</option>
                        </select>
                    </div>

                    <div class="form-field">
                        <label>Language</label>
                        <select id="download-language">
                            <option value="">All Languages</option>
                            <option value="en">English</option>
                            <option value="ja">Japanese</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-field">
                        <label>Start Chapter</label>
                        <input type="text" id="download-start" placeholder="1" />
                    </div>

                    <div class="form-field">
                        <label>End Chapter</label>
                        <input type="text" id="download-end" placeholder="latest" />
                    </div>
                </div>

                <div class="form-field">
                    <label>Save Directory (Optional)</label>
                    <input type="text" id="download-path" placeholder="Leave empty for default location" />
                    <small>💡 Enter absolute path (e.g., C:\Downloads or /home/user/downloads)</small>
                </div>

                <button class="btn-primary" id="start-download" style="margin-top: 20px;">
                    <i class="fas fa-download"></i>
                    Start Download
                </button>

                <div id="download-status" class="hidden" style="margin-top: 20px; padding: 15px; background: white; border-radius: 8px; border: 1px solid var(--border-color);">
                    <!-- Download status will be shown here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Tags Modal -->
    <div id="tags-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Select Tags</h3>
                <button class="modal-close" id="close-tags-modal">×</button>
            </div>

            <div class="modal-tabs">
                <button class="tab-btn active" data-tab="include">✓ Include Tags</button>
                <button class="tab-btn" data-tab="exclude">✗ Exclude Tags</button>
            </div>

            <div class="modal-body">
                <div id="include-tags-list" class="tags-list">
                    <p style="color: var(--text-light);">Loading tags...</p>
                </div>
                <div id="exclude-tags-list" class="tags-list hidden">
                    <p style="color: var(--text-light);">Loading tags...</p>
                </div>
            </div>

            <div style="padding: 20px; border-top: 1px solid var(--border-color);">
                <button class="btn-primary" id="apply-tags">Done</button>
            </div>
        </div>
    </div>

    <script>
        // Global state
        let allTags = [];
        let includedTags = [];
        let excludedTags = [];
        let currentTab = 'include';
        let currentView = 'home';
        let currentManga = null;

        // Navigation
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                const view = item.dataset.view;
                if (!view) return;

                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');

                document.querySelectorAll('.view-section').forEach(v => v.classList.add('hidden'));
                document.getElementById(view + '-view')?.classList.remove('hidden');

                document.getElementById('detail-view').classList.remove('active');
                document.getElementById('home-view').classList.remove('hidden');

                currentView = view;

                if (view === 'latest') {
                    browseLatest();
                }
            });
        });

        // Load tags on page load
        async function loadTags() {
            try {
                const res = await fetch('/api/search/tags');
                const data = await res.json();
                allTags = data.tags || [];
                renderTagsLists();
            } catch (e) {
                console.error('Failed to load tags:', e);
            }
        }

        function renderTagsLists() {
            const includeList = document.getElementById('include-tags-list');
            const excludeList = document.getElementById('exclude-tags-list');

            if (!allTags.length) return;

            const grouped = {};
            allTags.forEach(tag => {
                if (!grouped[tag.group]) grouped[tag.group] = [];
                grouped[tag.group].push(tag);
            });

            let includeHtml = '';
            let excludeHtml = '';

            Object.keys(grouped).sort().forEach(group => {
                includeHtml += `<div class="tag-group"><div class="tag-group-title">${group}</div>`;
                excludeHtml += `<div class="tag-group"><div class="tag-group-title">${group}</div>`;

                grouped[group].forEach(tag => {
                    const incChecked = includedTags.includes(tag.id) ? 'checked' : '';
                    const excChecked = excludedTags.includes(tag.id) ? 'checked' : '';

                    includeHtml += `
                        <label class="tag-checkbox">
                            <input type="checkbox" value="${tag.id}" ${incChecked} onchange="toggleTag('${tag.id}', 'include')">
                            ${tag.name}
                        </label>
                    `;

                    excludeHtml += `
                        <label class="tag-checkbox">
                            <input type="checkbox" value="${tag.id}" ${excChecked} onchange="toggleTag('${tag.id}', 'exclude')">
                            ${tag.name}
                        </label>
                    `;
                });

                includeHtml += `</div>`;
                excludeHtml += `</div>`;
            });

            includeList.innerHTML = includeHtml;
            excludeList.innerHTML = excludeHtml;
        }

        function toggleTag(tagId, type) {
            const arr = type === 'include' ? includedTags : excludedTags;
            const idx = arr.indexOf(tagId);

            if (idx > -1) {
                arr.splice(idx, 1);
            } else {
                arr.push(tagId);
            }

            updateTagsDisplay();
        }

        function updateTagsDisplay() {
            const container = document.getElementById('selected-tags-display');
            let html = '';

            includedTags.forEach(id => {
                const tag = allTags.find(t => t.id === id);
                if (tag) {
                    html += `<span class="tag-badge include">✓ ${tag.name} <button onclick="removeTag('${id}', 'include')">×</button></span>`;
                }
            });

            excludedTags.forEach(id => {
                const tag = allTags.find(t => t.id === id);
                if (tag) {
                    html += `<span class="tag-badge exclude">✗ ${tag.name} <button onclick="removeTag('${id}', 'exclude')">×</button></span>`;
                }
            });

            container.innerHTML = html;
        }

        function removeTag(tagId, type) {
            const arr = type === 'include' ? includedTags : excludedTags;
            const idx = arr.indexOf(tagId);
            if (idx > -1) arr.splice(idx, 1);
            updateTagsDisplay();
            renderTagsLists();
        }

        // Tags modal
        document.getElementById('open-tags-modal').addEventListener('click', () => {
            document.getElementById('tags-modal').classList.add('active');
        });

        document.getElementById('close-tags-modal').addEventListener('click', () => {
            document.getElementById('tags-modal').classList.remove('active');
        });

        document.getElementById('apply-tags').addEventListener('click', () => {
            document.getElementById('tags-modal').classList.remove('active');
        });

        document.querySelectorAll('.modal-tabs .tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.modal-tabs .tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const tab = btn.dataset.tab;
                document.getElementById('include-tags-list').classList.toggle('hidden', tab !== 'include');
                document.getElementById('exclude-tags-list').classList.toggle('hidden', tab !== 'exclude');
            });
        });

        // Search
        async function performSearch(params = {}) {
            const grid = document.getElementById('manga-grid');
            const loading = document.getElementById('loading');

            grid.innerHTML = '';
            loading.classList.remove('hidden');

            try {
                const queryParams = new URLSearchParams();
                
                const title = document.getElementById('quick-search').value.trim();
                const author = document.getElementById('filter-author').value.trim();
                const artist = document.getElementById('filter-artist').value.trim();
                const status = document.getElementById('filter-status').value;
                const language = document.getElementById('filter-language').value;
                const order = document.getElementById('filter-order').value;
                const limit = document.getElementById('filter-limit').value;

                if (title) queryParams.append('title', title);
                if (author) queryParams.append('authors', author);
                if (artist) queryParams.append('artists', artist);
                if (status) queryParams.append('status', status);
                if (language) queryParams.append('languages', language);
                if (order) queryParams.append('order', order);
                if (includedTags.length) queryParams.append('tags', includedTags.join(','));
                if (excludedTags.length) queryParams.append('excludedTags', excludedTags.join(','));
                queryParams.append('limit', limit || 12);
                queryParams.append('offset', 0);

                const res = await fetch(`/api/search/manga?${queryParams}`);
                const data = await res.json();

                loading.classList.add('hidden');

                if (!data.results || data.results.length === 0) {
                    grid.innerHTML = '<p style="text-align: center; color: var(--text-light); padding: 40px;">No results found</p>';
                    return;
                }

                data.results.forEach(manga => {
                    const card = document.createElement('div');
                    card.className = 'manga-card';
                    card.onclick = () => showMangaDetail(manga.id);
                    
                    card.innerHTML = `
                        <img src="${manga.coverUrl || '/static/placeholder.jpg'}" alt="${manga.title}" class="manga-cover" />
                        <div class="manga-info">
                            <div class="manga-title">${manga.title}</div>
                            <div class="manga-meta">
                                <span class="rating"><i class="fas fa-star"></i> N/A</span>
                                <span><i class="fas fa-book"></i> ${manga.status || 'N/A'}</span>
                            </div>
                        </div>
                    `;
                    
                    grid.appendChild(card);
                });
            } catch (e) {
                console.error('Search error:', e);
                loading.classList.add('hidden');
                grid.innerHTML = '<p style="text-align: center; color: red; padding: 40px;">Error loading results</p>';
            }
        }

        async function browseLatest() {
            document.getElementById('quick-search').value = '';
            document.getElementById('filter-author').value = '';
            document.getElementById('filter-artist').value = '';
            document.getElementById('filter-status').value = '';
            document.getElementById('filter-order').value = 'latestUploadedChapter';
            includedTags = [];
            excludedTags = [];
            updateTagsDisplay();
            await performSearch();
        }

        document.getElementById('apply-filters').addEventListener('click', performSearch);
        document.getElementById('browse-latest').addEventListener('click', browseLatest);

        document.getElementById('quick-search').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        // Manga detail
        async function showMangaDetail(mangaId) {
            try {
                const res = await fetch(`/api/manga/${mangaId}`);
                const data = await res.json();
                
                currentManga = data;

                const detailContent = document.getElementById('manga-detail-content');
                const tags = data.tags || [];
                const tagsHtml = tags.map(t => `<span class="tag-chip">${t}</span>`).join('');

                detailContent.innerHTML = `
                    <div class="detail-header">
                        <img src="${data.coverUrl || '/static/placeholder.jpg'}" alt="${data.title}" class="detail-cover-img" />
                        <div class="detail-info">
                            <h1 class="detail-title">${data.title}</h1>
                            <p class="detail-subtitle">${data.altTitle || ''}</p>
                            <p class="detail-author">${data.author || 'Unknown'}, ${data.artist || 'Unknown'}</p>
                            
                            <div class="detail-tags">
                                ${tagsHtml}
                            </div>

                            <div class="detail-actions">
                                <button class="btn-primary" onclick="downloadCurrentManga()">
                                    <i class="fas fa-download"></i>
                                    Download
                                </button>
                                <button class="btn-secondary">
                                    <i class="fas fa-bookmark"></i>
                                    Add to Library
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="detail-description">
                        <h3 style="margin-bottom: 15px;">Description</h3>
                        <p>${data.description || 'No description available.'}</p>
                    </div>

                    <div class="chapters-section">
                        <div class="chapters-header">
                            <span><i class="fas fa-list"></i> Chapters</span>
                            <span>Ch. 1 - ${data.chapterCount || 'N/A'}</span>
                        </div>
                        <div id="chapters-list">
                            <p style="padding: 20px; text-align: center; color: var(--text-light);">Loading chapters...</p>
                        </div>
                    </div>
                `;

                document.getElementById('home-view').classList.add('hidden');
                document.getElementById('detail-view').classList.add('active');

                // Load chapters
                loadChapters(mangaId);
            } catch (e) {
                console.error('Error loading manga detail:', e);
            }
        }

        async function loadChapters(mangaId) {
            try {
                const res = await fetch(`/api/manga/${mangaId}/chapters?limit=100`);
                const data = await res.json();
                
                const chaptersList = document.getElementById('chapters-list');
                
                if (!data.chapters || data.chapters.length === 0) {
                    chaptersList.innerHTML = '<p style="padding: 20px; text-align: center; color: var(--text-light);">No chapters available</p>';
                    return;
                }

                chaptersList.innerHTML = data.chapters.map(ch => `
                    <div class="chapter-item">
                        <div class="chapter-info">
                            <span class="chapter-number">Ch. ${ch.chapter || '?'}</span>
                            <span>${ch.title || ''}</span>
                        </div>
                        <div class="chapter-meta">
                            <span><i class="fas fa-language"></i> ${ch.language || 'N/A'}</span>
                            <span><i class="fas fa-clock"></i> ${ch.publishedAt || 'N/A'}</span>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                console.error('Error loading chapters:', e);
            }
        }

        document.getElementById('back-to-list').addEventListener('click', () => {
            document.getElementById('detail-view').classList.remove('active');
            document.getElementById('home-view').classList.remove('hidden');
        });

        function downloadCurrentManga() {
            if (!currentManga) return;
            
            document.getElementById('download-url').value = currentManga.id;
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.querySelector('.nav-item[data-view="download"]').classList.add('active');
            document.querySelectorAll('.view-section').forEach(v => v.classList.add('hidden'));
            document.getElementById('download-view').classList.remove('hidden');
            document.getElementById('detail-view').classList.remove('active');
        }

        // Download
        document.getElementById('start-download').addEventListener('click', async () => {
            const url = document.getElementById('download-url').value.trim();
            if (!url) {
                alert('Please enter manga URL or ID');
                return;
            }

            const statusDiv = document.getElementById('download-status');
            statusDiv.classList.remove('hidden');
            statusDiv.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

            try {
                const res = await fetch('/api/url/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        url: url,
                        format: document.getElementById('download-format').value,
                        language: document.getElementById('download-language').value,
                        start: document.getElementById('download-start').value,
                        end: document.getElementById('download-end').value,
                        path: document.getElementById('download-path').value
                    })
                });

                const data = await res.json();
                
                if (data.job_id) {
                    statusDiv.innerHTML = `<p style="color: green;"><i class="fas fa-check-circle"></i> Download started! Job ID: ${data.job_id}</p>`;
                } else {
                    statusDiv.innerHTML = `<p style="color: red;"><i class="fas fa-exclamation-circle"></i> Error: ${data.message || 'Unknown error'}</p>`;
                }
            } catch (e) {
                console.error('Download error:', e);
                statusDiv.innerHTML = `<p style="color: red;"><i class="fas fa-exclamation-circle"></i> Error: ${e.message}</p>`;
            }
        });

        // Initialize
        loadTags();
        browseLatest();
    </script>
</body>
</html>
